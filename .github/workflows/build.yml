name: Build iOS UE Dumper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        scheme:
          - default
          - rootless
          - roothide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Theos
        uses: iossxx/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/roothide/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Show environment
        run: |
          echo "THEOS=$THEOS"
          xcodebuild -version
          clang --version
          cd Tweak
          make --version

      - name: Build package
        working-directory: Tweak
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ matrix.scheme }}" = "default" ]; then
            make clean package FINALPACKAGE=1
          else
            make clean package \
              FINALPACKAGE=1 \
              THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          fi

      - name: List build output
        if: always()
        working-directory: Tweak
        run: |
          echo "===== PACKAGES ====="
          find packages -maxdepth 2 -type f -print 2>/dev/null || true

          echo "===== DYLIB ====="
          find .theos -type f -name "*.dylib" -print 2>/dev/null || true

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-UE-Dumper-${{ matrix.scheme }}
          path: |
            Tweak/packages/*.deb
            Tweak/.theos/obj/**/*.dylib
          if-no-files-found: warn
