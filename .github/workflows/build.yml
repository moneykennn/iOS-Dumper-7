name: Build Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List project
        run: |
          xcodebuild -project Dumper.xcodeproj -list

      - name: Build Dumper
        run: |
          set -o pipefail

          xcodebuild \
            -project Dumper.xcodeproj \
            -target Dumper \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Show build log tail
        if: always()
        run: |
          echo "===== LAST 100 LINES ====="
          tail -n 100 build.log || true

      - name: Find dylib
        if: always()
        run: |
          find . -type f -name "*.dylib" -print

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
